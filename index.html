<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

INTERFREIGHT | Employee Overtime Request

</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

background:#F4F7FC;

}

:root{

--primary:#0B4F9F;

--secondary:#FDB913;

--white:#ffffff;

--border:#E5EAF2;

--shadow:0 8px 25px rgba(0,0,0,.08);

}

    .sidebar{
    width:260px;
    background:#003366;
    color:white;
    padding:25px;
    position:fixed;
    left:0;
    top:0;
    height:100vh;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo img{
    width:120px;
}

.logo h2{
    margin-top:10px;
    font-size:22px;
    font-weight:700;
}

.menu a{
    display:block;
    padding:14px;
    margin-bottom:10px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:500;
    transition:.25s;
}

.menu a:hover{
    background:#0d437a;
}

.menu a.active{
    background:#F4C542;
    color:#003366;
    font-weight:bold;
}
.main{

margin-left:250px;

}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    color:#003366;
    font-size:42px;
    font-weight:700;
}

.logout-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.logout-btn:hover{
    background:#bb2d3b;
}

.content{

padding:30px;

}

.card{
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.section-title{
    color:#003366;
    margin-bottom:20px;
    border-left:5px solid #F4C542;
    padding-left:10px;
    font-size:24px;
}
.form-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

.form-group label{

margin-bottom:8px;

font-weight:500;

}

.form-group input,

.form-group select,

.form-group textarea{

padding:12px;

border:1px solid var(--border);

border-radius:8px;

font-size:14px;

}

textarea{

min-height:100px;

resize:none;

}

.btn{

padding:12px 20px;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

.btn-primary{
    background:#003366;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.btn-primary:hover{
    background:#0b4f8a;
}

@media(max-width:1000px){

    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }

    .main{
        margin-left:0;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}
</style>

</head>

<body>
<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        <img src="3. INTERFREIGHT COMPANY LOGO.png" alt="INTERFREIGHT Logo">
        <h2>INTERFREIGHT</h2>
    </div>

    <div class="menu">

        <a href="https://interfreight.github.io/employee_portal/">
            Dashboard
        </a>

        <a href="https://interfreight.github.io/employee_My_leave_history/">
            Leave History
        </a>

        <a href="#" class="active">
            Overtime Request
        </a>

    </div>


<!-- MAIN -->

<div class="header">

    <h1>Employee Overtime Request</h1>

    <button class="logout-btn"
        onclick="window.location.href='https://interfreight.github.io/login/'">

        Logout

    </button>

</div>

<small>

Submit your overtime request for approval

</small>



<div class="content">

<div class="card">

<h2 class="section-title">

Overtime Request Form

</h2>



<div class="form-grid">

<div class="form-group">

<label>

Employee Name

</label>

<input

id="employeeName"

readonly>

</div>



<div class="form-group">

<label>

Department

</label>

<input

id="department"

readonly>

</div>



<div class="form-group">

<label>

Position

</label>

<input

id="position"

readonly>

</div>


<div class="form-group">
<label>Date & Time In</label>
<input
type="datetime-local"
id="timeIn">
</div>

<div class="form-group">
<label>Date & Time Out</label>
<input
type="datetime-local"
id="timeOut">
</div>



<div class="form-group">

<label>

Total Hours

</label>

<input

id="totalHours"

readonly>

</div>



<div class="form-group"

style="grid-column:1/3;">

<label>

Reason for Overtime

</label>

<textarea

id="reason">

</textarea>

</div>



<div class="form-group"

style="grid-column:1/3;">

<label>

Attachment

</label>

<input

type="file"

id="attachment">

</div>



</div>

<br>

<button

class="btn btn-primary"

id="submitOTBtn">

<i class="fa fa-paper-plane"></i>

Submit Overtime Request

</button>

</div>



<!-- MY REQUESTS -->

<br>

<div class="card">

<h2 class="section-title">

My Overtime Requests

</h2>



<table

style="width:100%;
border-collapse:collapse;">

<thead>

<tr style="background:#0B4F9F;color:white;">

<th style="padding:12px;">Date</th>

<th>Hours</th>

<th>Department Status</th>

<th>HR Status</th>

<th>Department</th>

<th>Action</th>

</tr>

</thead>

<tbody id="requestTable">

</tbody>

</table>

</div>

</div>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/******************************************
SUPABASE
******************************************/

const SUPABASE_URL =
"https://tuihpvykuqbqnfyfepql.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1aWhwdnlrdXFicW5meWZlcHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjg4OTcsImV4cCI6MjA5NzMwNDg5N30.HZKS8CgFLjkZ-Bx2AIjFjurH3IsKjvf37Ft852CzJsQ";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/******************************************
GLOBAL VARIABLES
******************************************/

let employeeID = null;
let editingID = null;
let currentAttachment = "";

/******************************************
LOAD EMPLOYEE
******************************************/

async function loadEmployee(){

    const currentUser =
    JSON.parse(localStorage.getItem("currentUser"));

    if(!currentUser){

        alert("Please login first.");

        window.location.href =
        "https://interfreight.github.io/login/";

        return;

    }

    employeeID = currentUser.id;

    document.getElementById("employeeName").value =
    currentUser.full_name || "";

    document.getElementById("department").value =
    currentUser.department || "";

    const {data,error} =
    await supabaseClient
    .from("employee_profiles")
    .select("position")
    .eq("user_id",currentUser.id)
    .single();

    if(error){

        console.log(error);

        document.getElementById("position").value="";

        return;

    }

    document.getElementById("position").value =
    data.position || "";

}

/******************************************
COMPUTE HOURS
******************************************/

function computeHours(){

    const timeIn =
    document.getElementById("timeIn").value;

    const timeOut =
    document.getElementById("timeOut").value;

    if(!timeIn || !timeOut){

        document.getElementById("totalHours").value="";

        return;

    }

    let start =
    new Date(timeIn);

    let end =
    new Date(timeOut);

    if(end < start){

        end.setDate(end.getDate()+1);

    }

    const diff =
    end-start;

    const hrs =
    diff/1000/60/60;

    document.getElementById("totalHours").value =
    hrs.toFixed(2);

}

/******************************************
TIME EVENTS
******************************************/

document
.getElementById("timeIn")
.addEventListener(
"change",
computeHours
);

document
.getElementById("timeOut")
.addEventListener(
"change",
computeHours
);

/******************************************
UPLOAD ATTACHMENT
******************************************/

async function uploadAttachment(){

    const file =
    document.getElementById("attachment").files[0];

    if(!file){

        return currentAttachment;

    }

    const fileName =
    Date.now()+"_"+file.name;

    const {error} =
    await supabaseClient.storage
    .from("overtime-attachments")
    .upload(
        fileName,
        file,
        {
            upsert:true
        }
    );

    if(error){

        alert(error.message);

        return "";

    }

    const {data} =
    supabaseClient.storage
    .from("overtime-attachments")
    .getPublicUrl(fileName);

    return data.publicUrl;

}

/******************************************
CLEAR FORM
******************************************/

function clearForm(){

    editingID = null;

    currentAttachment = "";

    document.getElementById("timeIn").value="";

    document.getElementById("timeOut").value="";

    document.getElementById("totalHours").value="";

    document.getElementById("reason").value="";

    document.getElementById("attachment").value="";

    document.getElementById("submitOTBtn").innerHTML =
    '<i class="fa fa-paper-plane"></i> Submit Overtime Request';

}
function addRequestRow(row){

    const table =
    document.getElementById("requestTable");

   const canEdit =

(row.department_status || "").toLowerCase()=="pending"

&&

(row.hr_status || "").toLowerCase()=="pending";

   table.innerHTML += `
<tr>

    <td style="padding:12px">
        ${row.overtime_date}
    </td>

    <td>
        ${row.total_hours}
    </td>

    <td>
        ${row.department_status}
    </td>

    <td>
        ${row.hr_status}
    </td>

    <td>
        ${row.department}
    </td>

    <td>
        ${
        canEdit
        ?
        `
        <button class="btn btn-primary" onclick="editRequest('${row.id}')">
            Edit
        </button>

        <button class="btn" style="background:red;color:white"
        onclick="deleteRequest('${row.id}')">
            Delete
        </button>
        `
        :
        `Approved`
        }
    </td>

</tr>
`;
}
/******************************************
LOAD MY REQUESTS
******************************************/

async function loadMyRequests(){

    const currentUser =
    JSON.parse(localStorage.getItem("currentUser"));

    const {data,error} =
    await supabaseClient
    .from("employee_overtime")
    .select("*")
    .eq("employee_name",currentUser.full_name)
    .order("overtime_date",{ascending:false});

    if(error){

        console.log(error);

        return;

    }


console.log(data);
    const table =
    document.getElementById("requestTable");

    table.innerHTML="";

    if(data.length===0){

        table.innerHTML=
        `<tr>
            <td colspan="6"
            style="padding:20px;text-align:center;">
            No overtime requests found.
            </td>
        </tr>`;

        return;

    }

   data.forEach(function(row){

    addRequestRow(row);

});

}

    /******************************************
SUBMIT / UPDATE OVERTIME
******************************************/

async function submitOvertime(){

    if(!document.getElementById("timeIn").value){

        alert("Please select Time In.");
        return;

    }

    if(!document.getElementById("timeOut").value){

        alert("Please select Time Out.");
        return;

    }

    if(document.getElementById("reason").value.trim()==""){

        alert("Please enter the reason.");
        return;

    }

    const attachmentURL =
    await uploadAttachment();

    const timeInInput = document.getElementById("timeIn");
const timeOutInput = document.getElementById("timeOut");

console.log("TIME IN ELEMENT =", timeInInput);
console.log("TIME OUT ELEMENT =", timeOutInput);

const dateTimeIn = timeInInput.value;
const dateTimeOut = timeOutInput.value;

console.log("dateTimeIn =", dateTimeIn);
console.log("dateTimeOut =", dateTimeOut);


console.log("time_in =", dateTimeIn.split("T")[1]);
console.log("time_out =", dateTimeOut.split("T")[1]);
   const request = {

    employee_name:
    document.getElementById("employeeName").value,

    department:
    document.getElementById("department").value,

    position:
    document.getElementById("position").value,

    // DATE IN
    overtime_date:
    dateTimeIn.split("T")[0],

    // DATE OUT (NEW)
    overtime_end_date:
    dateTimeOut.split("T")[0],

    // TIME IN
    time_in:
    dateTimeIn.split("T")[1],

    // TIME OUT
    time_out:
    dateTimeOut.split("T")[1],

    total_hours:
    Number(document.getElementById("totalHours").value),

    reason:
    document.getElementById("reason").value,

    attachment:
    attachmentURL,

    department_status:"Pending",

    hr_status:"Pending"

};

    let error;
console.log(request);
    if(editingID){

        ({error}=await supabaseClient

        .from("employee_overtime")

        .update(request)

        .eq("id",editingID));

    }

    else{

        ({error}=await supabaseClient

        .from("employee_overtime")

        .insert([request]));

    }

   if(error){
    alert(error.message);
    return;
}

alert(editingID ? "Request Updated Successfully!" : "Request Submitted Successfully!");

clearForm();

await loadMyRequests(); 
    // Refresh the table
}
/******************************************
EDIT REQUEST
******************************************/
async function editRequest(id){

    const { data, error } = await supabaseClient
        .from("employee_overtime")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    console.log("FULL RECORD");
    console.log(data);

    console.log("time_in =", data.time_in);
    console.log("time_out =", data.time_out);

    editingID = id;
    currentAttachment = data.attachment || "";

   document.getElementById("timeIn").value =
`${data.overtime_date}T${String(data.time_in).slice(0,5)}`;

document.getElementById("timeOut").value =
`${data.overtime_end_date}T${String(data.time_out).slice(0,5)}`;

    document.getElementById("reason").value =
        data.reason;

    document.getElementById("totalHours").value =
        data.total_hours;

    document.getElementById("submitOTBtn").innerHTML =
        '<i class="fa fa-save"></i> Update Request';

    computeHours();

    console.log("INPUT timeIn =", document.getElementById("timeIn").value);
    console.log("INPUT timeOut =", document.getElementById("timeOut").value);
}
/******************************************
DELETE REQUEST
******************************************/

async function deleteRequest(id){

    if(!confirm("Delete this request?")){
        return;
    }

    const { error } = await supabaseClient
        .from("employee_overtime")
        .delete()
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    alert("Request deleted successfully.");

    await loadMyRequests();

}

document
.getElementById("submitOTBtn")
.addEventListener(
    "click",
    submitOvertime
);

document.addEventListener("DOMContentLoaded", async () => {

    await loadEmployee();

    await loadMyRequests();

});
</script>

</body>
</html>
